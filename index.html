<style>
:root{color-scheme:dark;--bg:#0e100f;--s1:#151816;--s2:#1b1f1c;--line:#252a27;--tx:#e7ebe8;--mut:#8b948f;--ac:#86c39a;
--c-p:#86c39a;--c-h:#d9b870;--c-a:#dd8a84;--c-l:#86a9d9;--c-s:#b49ad9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;touch-action:manipulation}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 18px 6px;max-width:720px;margin:0 auto}
header h1{margin:0;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}

#pill.ok i{background:var(--ac)}#pill.wait i{background:var(--c-h)}#pill.err i{background:var(--c-a)}

.big{font-size:26px;font-weight:300;letter-spacing:-.01em}

.list{margin-top:6px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;padding:13px 0;border-bottom:1px solid var(--line)}

.day{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;position:relative;cursor:pointer;padding:0;line-height:1.15}

.day.half{border-color:rgba(217,184,112,.45);background:rgba(217,184,112,.08)}.day.half b{color:var(--c-h)}
.day.absent{border-color:rgba(221,138,132,.45);background:rgba(221,138,132,.08)}.day.absent b{color:var(--c-a)}
.day.leave{border-color:rgba(134,169,217,.45);background:rgba(134,169,217,.08)}.day.leave b{color:var(--c-l)}
.day.sick{border-color:rgba(180,154,217,.45);background:rgba(180,154,217,.08)}.day.sick b{color:var(--c-s)}
.day.today{box-shadow:0 0 0 1px var(--tx)}
.day.fut{opacity:.35}
.d2{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%}
.d2.late{background:var(--c-h)}.d2.ot{background:var(--ac);right:11px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
.kv div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--mut)}
.kv b{font-weight:500}
details{border-top:1px solid var(--line);padding:14px 0;margin-top:22px}
summary{cursor:pointer;color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.lb{display:grid;grid-template-columns:20px 1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lb .rk{color:var(--mut);font-size:13px}
.lb .pc{font-variant-numeric:tabular-nums;font-weight:500}
.bar{height:2px;background:var(--line);margin-top:7px}
.bar div{height:100%;background:var(--ac)}
.rm{background:none;border:0;color:var(--mut);font-size:12px;cursor:pointer;padding:6px 0}
.add{display:flex;gap:8px}
.add input{margin-top:0}
ol{padding-left:20px;line-height:1.65;color:var(--mut);font-size:14px}
ol b{color:var(--tx);font-weight:500}

#modal .box{background:var(--s1);border-top:1px solid var(--line);width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom))}
#modal h3{margin:0;font-size:18px;font-weight:500}
#modal .sts{margin-top:16px;justify-content:space-between}
#modal .st{width:50px;height:50px;font-size:16px}
#modal .flags{justify-content:flex-start;margin-top:14px}
#modal .btns .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:var(--s2);border:1px solid var(--line);padding:10px 16px;border-radius:8px;transition:.25s;z-index:20;pointer-events:none;font-size:14px;text-align:center;max-width:88vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>

<body>
<header><h1>Attendance</h1><div id="pill" onclick="tab='sync';render()"></div></header>
<main id="main"></main>
<nav>
 <button data-t="today">Today</button>
 <button data-t="cal">Calendar</button>
 <button data-t="team">Team</button>
 <button data-t="sync">Sync</button>
</nav>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

<script type="text/plain" id="gs">
const SECRET='__SECRET__';
const SHEET='Attendance';
const WSHEET='Workers';
const COLORS={present:'#c8ecc9',half:'#fbe8a8',absent:'#f8c4c0',leave:'#bfd8f3',sick:'#dcc9f1'};
const CODES={present:'P',half:'H',absent:'A',leave:'Leave',sick:'Sick'};

function out(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON)}
function doGet(){return out({ok:true,msg:'running'})}

function logSheet(ss){
  let sh=ss.getSheetByName(SHEET);
  if(!sh){
    sh=ss.insertSheet(SHEET);
    const s1=ss.getSheetByName('Sheet1');
    if(s1&&s1.getLastRow()===0&&ss.getSheets().length>1)ss.deleteSheet(s1);
  }
  if(sh.getLastRow()===0){
    sh.appendRow(['Key','Date','Worker','Status','Late','Overtime','Updated']);
    sh.setFrozenRows(1);sh.getRange(1,1,1,7).setFontWeight('bold');
    sh.getRange('B:B').setNumberFormat('yyyy-mm-dd');
    sh.getRange('G:G').setNumberFormat('yyyy-mm-dd hh:mm');
    sh.hideColumns(1);
  }
  return sh;
}
function readLog(sh){
  const n=sh.getLastRow();if(n<2)return [];
  return sh.getRange(2,1,n-1,6).getValues().map(function(r){
    const p=String(r[0]).split('|');
    return {wid:p[0],date:p[1],worker:r[2],status:r[3],late:r[4]==='Yes',ot:r[5]==='Yes'};
  });
}
function readWorkers(ss){
  const w=ss.getSheetByName(WSHEET);
  if(!w||w.getLastRow()<2)return [];
  return w.getRange(2,1,w.getLastRow()-1,3).getValues().map(function(r){return {id:String(r[0]),name:String(r[1]),emoji:String(r[2])}});
}
function writeWorkers(ss,list){
  const w=ss.getSheetByName(WSHEET)||ss.insertSheet(WSHEET);
  w.clear();
  w.getRange(1,1,1,3).setValues([['Id','Name','Emoji']]).setFontWeight('bold');
  if(list.length)w.getRange(2,1,list.length,3).setValues(list.map(function(x){return [x.id,x.name,x.emoji||'']}));
}

function rebuildSummary(ss,log){
  const agg={};
  log.forEach(function(r){
    if(!CODES[r.status])return;
    const m=String(r.date).substring(0,7),k=m+'|'+r.wid;
    const a=agg[k]||(agg[k]={m:m,w:r.worker,present:0,half:0,absent:0,leave:0,sick:0,late:0,ot:0});
    a[r.status]++;if(r.late)a.late++;if(r.ot)a.ot++;
  });
  const list=Object.keys(agg).map(function(k){return agg[k]}).sort(function(a,b){
    return a.m<b.m?1:a.m>b.m?-1:(a.w<b.w?-1:1);
  });
  const data=list.map(function(a){
    const base=a.present+a.half+a.absent;
    return [a.m,a.w,a.present,a.half,a.absent,a.leave,a.sick,a.late,a.ot,base?(a.present+a.half*0.5)/base:''];
  });
  const sh=ss.getSheetByName('Summary')||ss.insertSheet('Summary');
  sh.clear();
  sh.getRange(1,1,1,10).setValues([['Month','Worker','Present','Half days','Absent','Leave','Sick','Late','Overtime','Attendance %']]).setFontWeight('bold');
  sh.setFrozenRows(1);
  if(data.length){
    sh.getRange(2,1,data.length,1).setNumberFormat('@');
    sh.getRange(2,1,data.length,10).setValues(data);
    sh.getRange(2,10,data.length,1).setNumberFormat('0%');
  }
}

function rebuildGrid(ss,log,workers,month){
  const y=parseInt(month.substring(0,4),10),m=parseInt(month.substring(5,7),10),days=new Date(y,m,0).getDate();
  const sh=ss.getSheetByName('Grid '+month)||ss.insertSheet('Grid '+month);
  sh.clear();
  const order=[],names={},cell={};
  workers.forEach(function(w){order.push(w.id);names[w.id]=w.name});
  log.forEach(function(r){
    if(String(r.date).substring(0,7)!==month)return;
    if(!names[r.wid]){names[r.wid]=r.worker;order.push(r.wid)}
    cell[r.wid+'|'+parseInt(String(r.date).substring(8),10)]=r;
  });
  const head=['Worker'];
  for(let d=1;d<=days;d++)head.push(d);
  ['Present','Half','Absent','Leave','Sick','Late','Overtime'].forEach(function(h){head.push(h)});
  const vals=[head],bgs=[head.map(function(){return '#e8e6dc'})];
  order.forEach(function(id){
    const row=[names[id]],bg=['#ffffff'],t={present:0,half:0,absent:0,leave:0,sick:0,late:0,ot:0};
    for(let d=1;d<=days;d++){
      const r=cell[id+'|'+d];
      if(r&&CODES[r.status]){
        t[r.status]++;if(r.late)t.late++;if(r.ot)t.ot++;
        row.push(CODES[r.status]+(r.late?' +L':'')+(r.ot?' +OT':''));bg.push(COLORS[r.status]);
      }else{row.push('');bg.push('#ffffff')}
    }
    [t.present,t.half,t.absent,t.leave,t.sick,t.late,t.ot].forEach(function(v){row.push(v);bg.push('#ffffff')});
    vals.push(row);bgs.push(bg);
  });
  const rng=sh.getRange(1,1,vals.length,head.length);
  rng.setValues(vals);rng.setBackgrounds(bgs);
  sh.getRange(1,1,1,head.length).setFontWeight('bold');
  sh.setFrozenRows(1);sh.setFrozenColumns(1);
  sh.getRange(1,2,vals.length,head.length-1).setHorizontalAlignment('center');
}

function doPost(e){
  const lock=LockService.getScriptLock();lock.waitLock(20000);
  try{
    const d=JSON.parse(e.postData.contents);
    if(d.secret!==SECRET)return out({ok:false,error:'wrong secret'});
    const ss=SpreadsheetApp.getActiveSpreadsheet();
    const sh=logSheet(ss);

    if(d.action==='dump'){
      return out({ok:true,workers:readWorkers(ss),rows:readLog(sh)});
    }

    const rows=d.rows||[];
    const last=sh.getLastRow();
    const keys=last>1?sh.getRange(2,1,last-1,1).getValues().map(function(r){return r[0]}):[];
    const idx={};keys.forEach(function(k,i){idx[k]=i+2});
    const now=new Date(),del=[],add=[],months={};
    rows.forEach(function(r){
      months[String(r.date).substring(0,7)]=1;
      const row=[r.key,r.date,r.worker,r.status,r.late?'Yes':'',r.ot?'Yes':'',now];
      if(!r.status){if(idx[r.key])del.push(idx[r.key])}
      else if(idx[r.key]){sh.getRange(idx[r.key],1,1,7).setValues([row])}
      else add.push(row);
    });
    if(add.length)sh.getRange(sh.getLastRow()+1,1,add.length,7).setValues(add);
    del.sort(function(a,b){return b-a}).forEach(function(r){sh.deleteRow(r)});
    const n=sh.getLastRow();
    if(n>2)sh.getRange(2,1,n-1,7).sort([{column:2,ascending:false},{column:3,ascending:true}]);

    if(d.workers&&d.workers.length)writeWorkers(ss,d.workers);
    if(rows.length){
      const log=readLog(sh),workers=readWorkers(ss);
      rebuildSummary(ss,log);
      Object.keys(months).forEach(function(m){rebuildGrid(ss,log,workers,m)});
    }
    return out({ok:true});
  }catch(err){return out({ok:false,error:String(err)})}
  finally{lock.releaseLock()}
}
</script>
<script>
const ST={present:['P','Present'],half:['H','Half day'],absent:['A','Absent'],leave:['L','Leave'],sick:['S','Sick']};
let S;try{S=JSON.parse(localStorage.getItem('att')||'null')}catch(e){}
S=S||{workers:[],days:{}};S.queue=S.queue||{};S.cfg=S.cfg||{url:'',secret:''};
let tab='today',selW=null,cur=new Date();cur.setDate(1);
const save=()=>{try{localStorage.setItem('att',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayS=()=>ds(new Date());
const k=(w,d)=>w+'|'+d;
const get=(w,d)=>S.days[k(w,d)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

function entries(w){return Object.keys(S.days).filter(x=>x.startsWith(w+'|')).map(x=>[x.split('|')[1],S.days[x]]).sort((a,b)=>a[0]<b[0]?-1:1)}
function streaks(w){let c=0,b=0;for(const[,e]of entries(w)){if(e.s==='present'||e.s==='half'){c++;b=Math.max(b,c)}else if(e.s==='absent')c=0}return{cur:c,best:b}}
function mstats(w,y,m){const r={present:0,half:0,absent:0,leave:0,sick:0,late:0,ot:0};
 for(const[d,e]of entries(w)){const [yy,mm]=d.split('-').map(Number);if(yy===y&&mm===m+1){r[e.s]++;if(e.late)r.late++;if(e.ot)r.ot++}}
 const base=r.present+r.half+r.absent;r.pct=base?Math.round((r.present+r.half*.5)/base*100):0;return r}
function badges(w){const all=entries(w).map(x=>x[1]),sk=streaks(w),n=new Date(),ms=mstats(w,n.getFullYear(),n.getMonth());
 const pres=all.filter(e=>e.s==='present').length,ot=all.filter(e=>e.ot).length;
 return[['First day',pres>=1],['5-day streak',sk.best>=5],['10-day streak',sk.best>=10],['20-day streak',sk.best>=20],
 ['Always on time',ms.present>=10&&ms.late===0],['Overtime regular',ot>=3],['Perfect month',ms.absent===0&&ms.present>=15],['50 days worked',pres>=50],['90%+ attendance',ms.pct>=90&&ms.present+ms.half+ms.absent>=10]]}

function setStatus(w,d,s,flags){
 const before=streaks(w).cur;
 if(!s){delete S.days[k(w,d)]}else{const o=get(w,d)||{};S.days[k(w,d)]={s,late:flags?flags.late:(s==='present'||s==='half')?!!o.late:false,ot:flags?flags.ot:(s==='present'||s==='half')?!!o.ot:false}}
 save();q(w,d);const after=streaks(w).cur,nm=(S.workers.find(x=>x.id===w)||{}).name;
 if(after>before&&[3,5,10,15,20,30].includes(after))toast(`${nm}: ${after}-day streak`);
}

function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 if(!S.workers.length&&tab!=='team'&&tab!=='sync'){tab='team';return render()}
 $('#main').innerHTML=tab==='today'?vToday():tab==='cal'?vCal():tab==='sync'?vSync():vTeam();
 updatePill();
}

function legend(dots){return '<div class="lg">'+Object.values(ST).map(x=>`<span><b>${x[0]}</b>${x[1]}</span>`).join('')+(dots?'<span><i style="color:var(--c-h)">&bull;</i> late</span><span><i style="color:var(--ac)">&bull;</i> overtime</span>':'')+'</div>'}
function sbtns(w,d,e){e=e||{};return Object.entries(ST).map(([s,[i,l]])=>`<button class="st s-${s} ${e.s===s?'on':''}" aria-label="${l}" onclick="mark('${w}','${d}','${s}')">${i}</button>`).join('')}
function flagBtns(w,d,e){return `<button class="fl ${e.late?'on':''}" onclick="flag('${w}','${d}','late')">Late</button><button class="fl ${e.ot?'on':''}" onclick="flag('${w}','${d}','ot')">Overtime</button>`}
function warnCard(){const n=Object.keys(S.queue).length;let m='';
 if(!S.cfg.url&&Object.keys(S.days).length)m="Sheet sync isn't set up, so your data only exists on this phone. Tap to set it up.";
 else if(n&&S.pendingSince&&Date.now()-S.pendingSince>864e5)m=`${n} entries haven't reached the Sheet for over a day. Get online, then tap here.`;
 return m?`<div class="warn" onclick="tab='sync';render()">${m}</div>`:''}
function vToday(){const d=todayS(),dt=new Date();
 const c={present:0,half:0,absent:0,leave:0,sick:0,none:0};S.workers.forEach(w=>{const e=get(w.id,d);c[e?e.s:'none']++});
 const parts=[];if(c.present)parts.push(c.present+' present');if(c.half)parts.push(c.half+' half');if(c.absent)parts.push(c.absent+' absent');if(c.leave)parts.push(c.leave+' leave');if(c.sick)parts.push(c.sick+' sick');if(c.none)parts.push(c.none+' unmarked');
 return warnCard()+`<div class="top"><div><div class="big">Today</div><div class="muted">${dt.toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long'})}</div></div><button class="link" onclick="allPresent()">Mark all present</button></div>
 <div class="summary">${parts.join(' · ')}</div>
 ${legend()}
 <div class="list">`+S.workers.map(w=>{const e=get(w.id,d)||{},ok=e.s==='present'||e.s==='half',sk=streaks(w.id).cur;
 return `<div class="row"><div><span class="nm">${esc(w.name)}</span><span class="meta">${sk>1?sk+' day streak':''}</span></div><div class="sts">${sbtns(w.id,d,e)}</div>${ok?`<div class="flags">${flagBtns(w.id,d,e)}</div>`:''}</div>`}).join('')+
 `</div>`}
function mark(w,d,s){const e=get(w,d);setStatus(w,d,e&&e.s===s?null:s);if(modalOpen)openDay(w,d);render()}
function flag(w,d,f){const e=get(w,d);if(!e)return;e[f]=!e[f];save();q(w,d);if(modalOpen)openDay(w,d);render()}
function allPresent(){const d=todayS();S.workers.forEach(w=>{if(!get(w.id,d))setStatus(w.id,d,'present')});toast('Everyone marked present');render()}

function vCal(){
 if(!selW||!S.workers.find(w=>w.id===selW))selW=S.workers[0].id;
 const y=cur.getFullYear(),m=cur.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),t=todayS();
 let cells='';['M','T','W','T','F','S','S'].forEach(x=>cells+=`<div class="dow">${x}</div>`);
 for(let i=0;i<first;i++)cells+='<div></div>';
 for(let d=1;d<=n;d++){const D=`${y}-${pad(m+1)}-${pad(d)}`,e=get(selW,D);
  cells+=`<button class="day ${e?e.s:''} ${D===t?'today':''} ${D>t?'fut':''}" onclick="openDay('${selW}','${D}')">${d}<b>${e?ST[e.s][0]:'&nbsp;'}</b>${e&&e.late?'<i class="d2 late"></i>':''}${e&&e.ot?'<i class="d2 ot"></i>':''}</button>`}
 const r=mstats(selW,y,m),sk=streaks(selW),bs=badges(selW),got=bs.filter(b=>b[1]).length;
 return `<select onchange="selW=this.value;render()">${S.workers.map(x=>`<option value="${x.id}" ${x.id===selW?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
 <div class="calhead"><button class="link" onclick="mon(-1)" aria-label="Previous month">&lsaquo;</button><span>${cur.toLocaleDateString('en-ZA',{month:'long',year:'numeric'})}</span><button class="link" onclick="mon(1)" aria-label="Next month">&rsaquo;</button></div>
 <div class="cal">${cells}</div>
 ${legend(true)}
 <div class="t">This month</div>
 <div class="kv"><div><span>Present</span><b>${r.present}</b></div><div><span>Half days</span><b>${r.half}</b></div><div><span>Absent</span><b>${r.absent}</b></div><div><span>Leave / sick</span><b>${r.leave+r.sick}</b></div><div><span>Late</span><b>${r.late}</b></div><div><span>Overtime</span><b>${r.ot}</b></div><div><span>Attendance</span><b>${r.pct}%</b></div><div><span>Streak</span><b>${sk.cur} (best ${sk.best})</b></div></div>
 <details><summary>Achievements (${got}/${bs.length})</summary><div class="chips">${bs.map(([l,ok])=>`<span class="bdg ${ok?'':'lock'}">${l}</span>`).join('')}</div></details>`}
function mon(x){cur.setMonth(cur.getMonth()+x);render()}

let modalOpen=false;
function openDay(w,d){modalOpen=true;const e=get(w,d)||{},wk=S.workers.find(x=>x.id===w),ok=e.s==='present'||e.s==='half';
 $('#mbox').innerHTML=`<h3>${esc(wk.name)}</h3><div class="muted">${new Date(d+'T12:00').toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long'})}</div>
 <div class="sts">${sbtns(w,d,e)}</div>
 ${legend()}
 ${ok?`<div class="flags">${flagBtns(w,d,e)}</div>`:''}
 <div class="btns" style="margin-top:22px"><button class="btn" onclick="mark('${w}','${d}','${e.s||''}');closeM()">Clear</button><button class="btn pri" onclick="closeM()">Done</button></div>`;
 $('#modal').style.display='flex'}
function closeM(){modalOpen=false;$('#modal').style.display='none';render()}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});

function vTeam(){const n=new Date(),y=n.getFullYear(),m=n.getMonth();
 const rows=S.workers.map(w=>({w,r:mstats(w.id,y,m),s:streaks(w.id)})).sort((a,b)=>b.r.pct-a.r.pct||b.s.cur-a.s.cur);
 return `<div class="t" style="margin-top:14px">Add person</div><div class="add"><input id="nn" placeholder="Name" onkeydown="if(event.key==='Enter')addW()"><button class="btn pri" onclick="addW()">Add</button></div>`+
 (rows.length?`<div class="t">${n.toLocaleDateString('en-ZA',{month:'long'})} ranking</div>`+rows.map((x,i)=>`<div class="lb"><span class="rk">${i+1}</span><div><div>${esc(x.w.name)}</div><div class="bar"><div style="width:${x.r.pct}%"></div></div></div><span class="pc">${x.r.pct}%</span><button class="rm" onclick="delW('${x.w.id}')">Remove</button></div>`).join(''):'<p class="sub">Add your first person to get started.</p>')}
function addW(){const v=$('#nn').value.trim();if(!v)return;S.workers.push({id:'w'+Date.now(),name:v,emoji:''});S.wdirty=true;save();trySync();render()}
function delW(id){const w=S.workers.find(x=>x.id===id);if(!confirm(`Remove ${w.name} and all their records?`))return;S.workers=S.workers.filter(x=>x.id!==id);Object.keys(S.days).forEach(x=>{if(x.startsWith(id+'|')){S.queue[x]={key:x,date:x.split('|')[1],worker:w.name,status:'',late:false,ot:false};delete S.days[x]}});S.wdirty=true;save();trySync();render()}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});

/* ---------- Google Sheet sync (offline-first) ---------- */
let syncing=false,lastErr='',restoring=false;
function q(w,d){const e=get(w,d),wk=S.workers.find(x=>x.id===w);if(!wk)return;
 S.queue[k(w,d)]={key:k(w,d),date:d,worker:wk.name,status:e?e.s:'',late:e?!!e.late:false,ot:e?!!e.ot:false};if(!S.pendingSince)S.pendingSince=Date.now();save();trySync()}
function pillState(){const n=Object.keys(S.queue).length+(S.wdirty?1:0);
 if(!S.cfg.url)return['Sync not set up',''];
 if(!navigator.onLine)return['Offline'+(n?` · ${n} waiting`:''),n?'wait':''];
 if(lastErr&&n)return[`${n} waiting · ${lastErr}`,'err'];
 return n?[`${n} waiting`,'wait']:['Synced','ok']}
function updatePill(){const[t,c]=pillState(),p=$('#pill');if(p){p.className=c;p.innerHTML='<i></i>'+esc(t)}const s=$('#sst');if(s)s.textContent=t}
async function post(rows,extra){const r=await fetch(S.cfg.url,{method:'POST',body:JSON.stringify(Object.assign({secret:S.cfg.secret,rows},extra||{}))});return r.json()}
async function trySync(){
 if(syncing||!S.cfg.url||!navigator.onLine)return updatePill();
 syncing=true;
 try{
  for(let pass=0;pass<5;pass++){
   let items,ok=true;
   while((items=Object.values(S.queue).slice(0,200)).length){
    const j=await post(items,{workers:S.workers});
    if(!j.ok){lastErr=j.error||'error';ok=false;break}
    items.forEach(i=>{if(S.queue[i.key]===i)delete S.queue[i.key]});save();lastErr='';
   }
   if(ok&&S.wdirty){S.wdirty=false;let j;
    try{j=await post([],{workers:S.workers})}catch(e){S.wdirty=true;throw e}
    if(!j.ok){S.wdirty=true;lastErr=j.error||'error';ok=false}else{save();lastErr=''}}
   if(!ok||(!Object.keys(S.queue).length&&!S.wdirty))break;
  }
 }catch(e){lastErr='no connection'}
 if(!Object.keys(S.queue).length&&!S.wdirty&&S.pendingSince){delete S.pendingSince;save()}
 syncing=false;updatePill();
}

/* ---------- private restore link ---------- */
function b64e(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
function parseCode(t){t=(t||'').trim();const i=t.indexOf('#r=');
 if(i>=0){try{t=b64d(t.slice(i+3))}catch(e){return null}}
 const p=t.split('|');if(p.length<2||!/^https:\/\//.test(p[0].trim()))return null;
 return{url:p[0].trim(),secret:p.slice(1).join('|').trim()}}
function restoreLink(){return location.origin+location.pathname+'#r='+b64e(S.cfg.url+'|'+S.cfg.secret)}
function consumeHash(){let used=false;
 if((location.hash||'').startsWith('#r=')){const c=parseCode(location.hash);
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(c){S.cfg.url=c.url;S.cfg.secret=c.secret;save();used=true}}
 return used}
async function autoRestore(){
 if(restoring||!S.cfg.url||S.workers.length||Object.keys(S.days).length||!navigator.onLine)return;
 await restoreSheet(true)}
async function restoreSheet(auto){
 if(!S.cfg.url)return toast('Set up sync first');
 if(restoring)return;
 if(!auto&&!confirm('Pull the history from the Sheet into this phone? Nothing already here is overwritten.'))return;
 restoring=true;
 try{const j=await post(null,{action:'dump'});
  if(!j.ok){toast(auto?'Could not restore yet, will retry':(j.error||'Restore failed'));return}
  let a=0;
  (j.workers||[]).forEach(w=>{if(!S.workers.find(x=>x.id===w.id))S.workers.push({id:w.id,name:w.name,emoji:''})});
  (j.rows||[]).forEach(r=>{if(!r.status)return;const key=r.wid+'|'+r.date;
   if(!S.workers.find(x=>x.id===r.wid))S.workers.push({id:r.wid,name:r.worker,emoji:''});
   if(!S.days[key]){S.days[key]={s:r.status,late:!!r.late,ot:!!r.ot};a++}});
  save();render();toast(`Restored ${a} entries, ${S.workers.length} people`)
 }catch(e){toast(auto?'Could not restore yet, will retry':'Cannot reach the Sheet')}
 finally{restoring=false}}

function vSync(){
 if(!S.cfg.secret){S.cfg.secret=Array.from(crypto.getRandomValues(new Uint8Array(9)),b=>b.toString(36).padStart(2,'0')).join('');save()}
 const code=$('#gs').textContent.trim().replace('__SECRET__',S.cfg.secret);
 return `<div class="t" style="margin-top:14px">Sheet sync</div><div class="muted" id="sst"></div>
 <input id="cu" placeholder="Web app URL, restore link or setup code" value="${esc(S.cfg.url)}">
 <input id="cs" placeholder="Secret (must match the script)" value="${esc(S.cfg.secret)}">
 <div class="btns"><button class="btn pri" onclick="saveCfg()">Save</button><button class="btn" onclick="testCfg()">Test</button><button class="btn" onclick="trySync();toast('Syncing')">Sync now</button></div>
 <div class="t">Restore</div>
 <p class="sub">If this phone is ever wiped, open your private restore link. It reconnects to the Sheet and brings everything back. Keep the link private: save it in WhatsApp or Notes.</p>
 <div class="btns"><button class="btn pri" onclick="copyRestoreLink()">Copy restore link</button><button class="btn" onclick="restoreSheet()">Restore from Sheet</button><button class="btn" onclick="resendAll()">Re-send everything</button></div>
 <div class="t">Backup</div>
 <div class="btns"><button class="btn" onclick="backupFile()">Backup to file</button><label class="btn" style="cursor:pointer">Import backup<input type="file" accept=".json,application/json" style="display:none" onchange="importFile(this)"></label></div>
 <details><summary>Sheet setup (one time)</summary><ol>
 <li>In Google Drive (work account) create a <b>blank Google Sheet</b>.</li>
 <li>Open <b>Extensions &rarr; Apps Script</b>. Delete everything there, paste the code below, click Save.</li>
 <li>Click <b>Deploy &rarr; New deployment</b>, gear icon, <b>Web app</b>. Execute as <b>Me</b>, access <b>Anyone</b>. Deploy and allow access (Advanced &rarr; Go to project).</li>
 <li>Copy the <b>Web app URL</b>, paste it above, press <b>Save</b> then <b>Test</b>.</li>
 <li>Share the Sheet with the viewing accounts as <b>Viewer</b>.</li></ol>
 <textarea id="gcode" readonly>${esc(code)}</textarea>
 <div class="btns"><button class="btn" onclick="copyCode()">Copy code</button></div>
 <p class="sub">The code contains your private secret. If you change the code, use Deploy &rarr; Manage deployments &rarr; Edit &rarr; New version so the URL stays the same.</p></details>`}
function readCfg(){const raw=$('#cu').value.trim(),sec=$('#cs').value.trim();
 const c=parseCode(raw);
 if(c){S.cfg.url=c.url;S.cfg.secret=c.secret}else{S.cfg.url=raw;if(sec)S.cfg.secret=sec}
 save()}
function saveCfg(){readCfg();toast('Saved');render();trySync();autoRestore()}
async function testCfg(){readCfg();
 if(!S.cfg.url)return toast('Paste the URL first');
 try{const j=await post([]);toast(j.ok?'Connected':(j.error||'Failed'))}catch(e){toast('Cannot reach it (offline or wrong URL)')}}
function resendAll(){Object.keys(S.days).forEach(x=>{const[w,d]=x.split('|');q(w,d)});S.wdirty=true;save();trySync();toast('Queued everything')}
function backupFile(){const blob=new Blob([JSON.stringify({v:1,workers:S.workers,days:S.days})],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='attendance-backup-'+todayS()+'.json';document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);toast('Backup saved to Downloads')}
function importFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.workers||!j.days)throw 0;let a=0;
  j.workers.forEach(w=>{if(!S.workers.find(x=>x.id===w.id))S.workers.push(w)});
  Object.keys(j.days).forEach(x=>{if(!S.days[x]){S.days[x]=j.days[x];const[w,d]=x.split('|');q(w,d);a++}});
  S.wdirty=true;save();render();toast(`Imported ${a} entries`)}catch(e){toast('Not a valid backup file')}};
 r.readAsText(f);inp.value=''}
function copyText(t){const x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity=0;document.body.appendChild(x);x.select();
 let ok=false;try{ok=document.execCommand('copy')}catch(e){}x.remove();
 if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t).catch(()=>{});return ok}
function copyRestoreLink(){if(!S.cfg.url)return toast('Save the URL first');copyText(restoreLink());toast('Restore link copied. Keep it private.')}
function copyCode(){const t=$('#gcode');t.select();document.execCommand('copy');toast('Copied')}
window.addEventListener('online',()=>{trySync();autoRestore()});window.addEventListener('offline',updatePill);
setInterval(()=>{trySync();autoRestore()},60000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
const linked=consumeHash();
render();trySync();
if(linked&&(S.workers.length||Object.keys(S.days).length))toast('Connected to your Sheet');
autoRestore();
</script>
